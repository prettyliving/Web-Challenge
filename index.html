<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Into Nature</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(#87ceeb, #e0f7fa);
}

/* Sky */
.sky {
  position: absolute;
  width: 100%;
  height: 60%;
  background: linear-gradient(#87ceeb, #b3e5fc);
}

/* Sun */
.sun {
  position: absolute;
  top: 60px;
  right: 100px;
  width: 80px;
  height: 80px;
  background: #ffeb3b;
  border-radius: 50%;
}

/* Mountains */
.mountains {
  position: absolute;
  bottom: 30%;
  width: 200%;
  height: 200px;
  background: repeating-linear-gradient(
    135deg,
    #2e7d32,
    #2e7d32 40px,
    #388e3c 40px,
    #388e3c 80px
  );
  animation: moveBackground 20s linear infinite;
}

/* Road */
.road {
  position: absolute;
  bottom: 0;
  width: 200%;
  height: 30%;
  background: #424242;
  animation: moveBackground 5s linear infinite;
}

.road::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  width: 200%;
  height: 6px;
  background: repeating-linear-gradient(
    to right,
    #fff,
    #fff 40px,
    transparent 40px,
    transparent 80px
  );
  transform: translateY(-50%);
}

/* Car */
.car {
  position: absolute;
  bottom: 15%;
  left: 20%;
  width: 180px;
  height: 60px;
  background: #e53935;
  border-radius: 10px;
}

.car::before {
  content: "";
  position: absolute;
  top: -30px;
  left: 30px;
  width: 120px;
  height: 40px;
  background: #c62828;
  border-radius: 10px 10px 0 0;
}

/* Wheels */
.wheel {
  position: absolute;
  bottom: -20px;
  width: 40px;
  height: 40px;
  background: #111;
  border-radius: 50%;
  animation: spin 0.5s linear infinite;
}

.wheel.left {
  left: 20px;
}

.wheel.right {
  right: 20px;
}

/* Animations */
@keyframes moveBackground {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Title */
.title {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 2rem;
  font-weight: bold;
  color: #1b5e20;
}
</style>
</head>
<body>

<div class="sky"></div>
<div class="sun"></div>
<div class="mountains"></div>
<div class="road"></div>

<div class="car">
  <div class="wheel left"></div>
  <div class="wheel right"></div>
</div>

<div class="title">Drive Into Nature</div>

</body>
</html>
