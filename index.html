<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Into Nature</title>

    <style>
        body { 
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to top, #2c5364, #203a43, #0f2027);
            color: #fff;
            text-align: center;
            overflow: hidden;
        
        }
        h1 {
            margin-top: 40px;
            font-size: 3rem;
        }
        .car {
            font-size: 4rem;
            position: absolute;
            bottom: 80px;
            left: -100px;
            transition: left 3s ease-in-out;
        }
        .road {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 20px;
            background: #444;
        }
        button { 
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: #00c9a7;
            color: #050404;
            font-weight: bold;
        }
        button:hover {
            background: #00a68a;
        }
        .trees {
            position: absolute;
            bottom: 120px;
            width: 100%;
            font-size: 2rem;
        }
    </style>  
</head>
<body>
    <h1>Drive Into Nature</h1>
    <p>Click the botton and let the journey begin.</p>

    <button onclick="drive()">Start the Ride</button>

    <div class="trees">🌲🌳🌲🌳🌲</div>
    <div class="road"></div>
    <div class="car" id="car"🚗></div>

    <script>
        function drive() {
            const car = document.getElementById('car');
            car.style.left = "110%";
            setTimeout(() =>{
                car.style.left = "-100px";
            }, 3200);
        }
    </script>
</body>

</html>
